<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1152" id="viewport-meta" />
    <title>THE MUDDLED RENDERINGS PROJECT</title>
    <meta name="description" content="An anthology of experimental generative art and data visualization pages, featuring the canonical OECD Economic Atlas alongside publishable generative rendering projects." />
    <meta property="og:title" content="THE MUDDLED RENDERINGS PROJECT" />
    <meta property="og:description" content="An anthology of experimental generative art and data visualization pages, featuring the canonical OECD Economic Atlas alongside publishable generative rendering projects." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/fonts/nano.ttf" as="font" type="font/ttf" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        var TARGET_DESKTOP_WIDTH = 1152;
        function updateViewportScale() {
          var meta = document.getElementById('viewport-meta');
          if (!meta) {
            meta = document.createElement('meta');
            meta.id = 'viewport-meta';
            meta.name = 'viewport';
            document.head.appendChild(meta);
          }
          var screenWidth = window.screen.width;
          if (screenWidth < TARGET_DESKTOP_WIDTH) {
            // Mobile and tablet devices: lock viewport to 1152px desktop width so the layout scales proportionally to fit
            meta.setAttribute('content', 'width=' + TARGET_DESKTOP_WIDTH + ', user-scalable=yes');
          } else {
            // Standard wide desktop screens
            meta.setAttribute('content', 'width=device-width, initial-scale=1.0');
          }
        }
        updateViewportScale();
        window.addEventListener('resize', updateViewportScale);
        window.addEventListener('orientationchange', updateViewportScale);
      })();
    </script>
  </head>
  <body class="bg-[#0c0d12] text-[#e2e4ec] selection:bg-[#705df2]/30 selection:text-white antialiased min-w-[1152px] overflow-x-auto">
    <div id="root" class="min-w-[1152px]"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
